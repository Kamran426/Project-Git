<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, world.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  html, body { height: 100%; }

  main {
    position: relative;
    min-height: 100svh;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: var(--pad);
  }

  .site-header {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    z-index: 2;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .copy { position: relative; z-index: 1; }

  h1 {
    margin: 0;
    font-weight: 800;
    font-stretch: 80%;
    font-size: clamp(4.5rem, 15vw, 12rem);
    line-height: 0.86;
    letter-spacing: -0.012em;
  }

  .greeting {
    margin: clamp(20px, 3vw, 36px) 0 0;
    min-height: 2.9em;
  }

  .swap {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .swap.out { opacity: 0; transform: translateY(0.2em); }
  .swap.pre { opacity: 0; transform: translateY(-0.2em); transition: none; }

  .word {
    display: block;
    width: max-content;
    font-size: clamp(2.25rem, 6vw, 4.25rem);
    font-weight: 600;
    font-stretch: 90%;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--sun);
  }

  .where {
    display: block;
    margin-top: 0.35rem;
    font-size: 1.0625rem;
    color: var(--chalk-soft);
  }

  #next { margin-top: clamp(20px, 3vw, 32px); }

  @media (prefers-reduced-motion: reduce) {
    .swap { transition: none; }
  }
</style>
</head>
<body>
<main id="stage">
  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="hello-world.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <canvas id="globe" aria-hidden="true"></canvas>

  <div class="copy" id="copy">
    <h1>Hello,<br>world.</h1>

    <p class="greeting">
      <span class="word swap" id="word" lang="es">Hola</span>
      <span class="where swap" id="where">Spanish, Mexico City</span>
    </p>

    <button type="button" class="btn" id="next">Say hello somewhere else</button>
  </div>
</main>

<script>
(() => {
  "use strict";

  /* ---------- Land mask: 360 x 180 cells, one bit per 1° cell ---------- */
  const MASK_W = 360, MASK_H = 180;
  const MASK_B64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/P8HAAD//wEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD+////P+7///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOD/////////////AAAAAAAAAAAAAAAAAA4AAAAAAAAAAAAAAAAAAAAAAAAAAPj///////////8PAAAA+v8AAP8AAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAHPj//x/8//////8DAADA/z8AAAAAAAAAAP4HAAAAAAAAAAAAAAAAAAAAAAB4/N73//3///////8BAACA/w8AAAAAAAAAAOA/AAAAAAAAAAAAAAAAAAAAAPB8AH34f/D///////8BAAAAfh8AAAAAAAAAAIB+AAAAAAAAAAAAAAAAAAAAAP7v4v//f8D///////8DAAAAOAAAAAAA/gEAAM7/PwAAwAMAAAAAAAAAAAAAAMT/5///DwAA/v////8BAAAAAAAAAAD4HwAA+P//fwAA8P8HAAAAAAAAAAAAgH98APv/HwAA/P////8BAAAAAAAAAAB4AAAA/P//BwAAwJ8DAAAAAAAAAAAAgP+Dz///+wAA+P////8AAAAAAAAAAAAeAALw/////48fgA8AAAAAAAAAAAAAwP9/5//+/wEA8P///z8AAAAAAAAAAIAPAN7+//////8/gP8DAAAABwCAAQAAwP//j//8/w8A8P///z8AAAAAABABAIAPwP////////8///8HAgDAAwD8/xcAnOH///r9//8B4P///38AAAAAAP4PAAA+wN//////////////D0DAAAD////x////f//H//8D4P///wcAAAAAgP//AQAA3////////////////89/B+D/////////P/7Ph/8DgP///wEAAAAA8P//hwf+////////////////////P4D/////////////x/kPwP//DwAAAAAA/P//v/f//////////////////////+H/////////////Afx/wP//AzA5AAAA/v/////////////////////////////////////////fwf8dgP//APh/AAAA/+d//v//////////////////////8eD/////////////7/8XgP8PAPA/AADA//P/////////////////////////AI/////////////zDvgPAP8HAOAHAADw//7///////////////////////9/AMT///////////8D//8HAPwDAAAAAAD+P/7/////////////////////////AOD//////////z8A2H8CAPwDAAAAAAD/P/7///////////////////////8HAPD//////////z8AwH8IAPgBAAAAAAD+f/7/////////////////////8P8BAGD/85D//////z8AwH8cAAAAAAAAAAD+P/z/////////////////////8EUAAAD0BwD8/////38A4P8/AAAAAAAAwAGeP/j//////////////////wEYfAAAAADgDwDA//////8DgP8/AAAAAAAAwAfwH/7/////////////////fwAA/wAAAAD4AgCA//////8PgP9/AAAAAAAA4ANwD/7/////////////////PwCA/wAAAAA/AAAA////////4///AQAAAAAA8APwB/7/////////////////HwCAPwAAAIABAADA////////8///BwAAAAAA+A/w////////////////////3wSAfwAAAAAAAADA/P//////4///HwAAAAAAvB///////////////////////weAHwAAAAAAAACA/f//////5///HwAAAAAAvD///////////////////////w8ABwAAAAAAAAAA8P//////////HwAAAAAAzP///////////////////////w8ABwAAAAAAAAAA+P//////////DAAAAAAAwP///////////////////////w0AAAAAAAAAAAAA+P////////9/fgAAAAAAQPz//////////////////////w0AAAAAAAAAAAAAwP////////8P/wAAAAAAgP///////////////////////xcAAAAAAAAAAAAAgP////////+P/wAAAAAAgP///////3///////////////wQAAAAAAAAAAAAAgP////////+/cAAAAAAAAPz//////x/8////////////fw4AAAAAAAAAAAAAAP//////////AQAAAAAAAPz////z/wf8////////////HwYAAAAAAAAAAAAAAP////////8fAAAAAAAAAPz////j/gP/////////////Dy4AAAAAAAAAAAAAgP///////38GAAAAAAAA/P/v8/8B+Af/////////////Dz8AAAAAAAAAAAAAgP///////z8AAAAAAAAA+H/w5//g4Af8//////////9/gx8AAAAAAAAAAAAAgP///////38AAAAAAAAA/P8wn///+Q/4//////////8/gAsAAAAAAAAAAAAAgP///////x8AAAAAAAAA+B8w/P///x/4//////////8/gAMAAAAAAAAAAAAAAP///////wMAAAAAAAAA/A8w+M///x/8/////////+8PAAMAAAAAAAAAAAAAAP///////wMAAAAAAAAA/B8QP9///w/8/////////ycfgAEAAAAAAAAAAAAAAP7//////wEAAAAAAAAA+A/sH57//x/8/////////38/0AEAAAAAAAAAAAAAAPz//////wEAAAAAAAAA+PP/DI7//z/8/////////3888AEAAAAAAAAAAAAAAPj//////wEAAAAAAAAA4P9/AHjw/////////////w88/wEAAAAAAAAAAAAAAPj//////wAAAAAAAAAA4P9/ABDw/////////////x/cfwAAAAAAAAAAAAAAAOD/////PwAAAAAAAAAA+P//AACA/////////////x/gDwAAAAAAAAAAAAAAAMD/////DwAAAAAAAAAA/P//Dw/A/////////////z/gAwAAAAAAAAAAAAAAAID/////BwAAAAAAAAAA/P//n//f/////////////z/AAAAAAAAAAAAAAAAAAID/////BwAAAAAAAAAA/P///////////////////z8AAAAAAAAAAAAAAAAAAAD///9HDwAAAAAAAAAA/v///////////////////38AAAAAAAAAAAAAAAAAAAD+/x8ADgAAAAAAAACA/////////9///////////z8AAAAAAAAAAAAAAAAAAAD//wcATgAAAAAAAADA/////////7///////////x8AAAAAAAAAAAAAAAAAAADc/wcA7gAAAAAAAADg//////9////+/////////w8AAAAAAAAAAAAAAAAAAAD4/wcAbAAAAAAAAADg//////9////4/////////y8AAAAAAAAAAAAAAAAAAAA4/wcAYAAAAAAAAADw//////9//v8fgP///////zcAAAAAAAAAAAAAAAAAAABg/gcATgAAAAAAAAD4/////////P9/gP///////zMAAAAAAAAAAAAQAAAAAABg/geAfwAAAAAAAAD4////////+f//AP7//////zAAAAAAAAAAAADwAAAAAAAA/Ae8+AEAAAAAAAD8////////+///APz/f///DxAAAAAAAAAAAACAAQAAAAAA/Ac+4AMAAAAAAAD8////////+f9/APz/D/9/BgAAAAAAAAAAAACAAwAAAAAA/A8ewH8AAAAAAAD4////////8/8/APD/A/4/DwAAAAAAAAAAAAAAAQAAAAAA8P8f4P4HAAAAAAD4////////4/8/AOD/APx/B3AAAAAAAAAAAAAAAAAAAAAA4P8PwBAHAAAAAAD4////////5/8fAOD/APx/AHAAAAAAAAAAAAAAAAAAAAAAAP8vAAAAAAAAAAD4////////x/8HAOB/APz/AXgAAAAAAAAAAAAAAAAAAAAAAMz/AQAAAAAAAAD4////////z/8BAOAfAOz/ATgAAAAAAAAAAAAAAAAAAAAAAID/AQAAAAAAAAD8/////////z8AAMAfAOD/AXAAAAAAAAAAAAAAAAAAAAAAAAD/AQAAAAAAAAD4/////////x8AAMAfAMD/A/AAAAAAAAAAAAAAAAAAAAAAAADwAVAAAAAAAAD4/////////8MAAMAPAMD/AzADAAAAAAAAAAAAAAAAAAAAAADgAf4AAAAAAAD4//////////gAAIAPAMD4A+gDAAAAAAAAAAAAAAAAAAAAAADAAf//AAAAAADg//////////8AAAAPAMD4AOwDAAAAAAAAAAAAAAAAAAAAAADAv///AAAAAADg/////////38AAAAfAMBwAMYGAAAAAAAAAAAAAAAAAAAAAAAA////AQAAAADA/////////38AAAA/AMAhAMIHAAAAAAAAAAAAAAAAAAAAAAAA7P//AwAAAACA/////////z8AAAA6AMABAOAHAAAAAAAAAAAAAAAAAAAAAAAAwP//FwAAAAAA/////////z8AAAA4AIAHAMMHAAAAAAAAAAAAAAAAAAAAAAAAwP///wAAAAAA/D/+/////x8AAAAQADgHgA8CAAAAAAAAAAAAAAAAAAAAAAAAwP///wEAAAAAfAf+/////w8AAAAAAHgPwAcAAAAAAAAAAAAAAAAAAAAAAAAAwP///wEAAAAAAADw/////wcAAAAAAPAP8AMAAAAAAAAAAAAAAAAAAAAAAAAA4P///wEAAAAAAADg/////wcAAAAAAOAP+gcIAAAAAAAAAAAAAAAAAAAAAAAA4P///wcAAAAAAADg/////wEAAAAAAMAf/jMaAAAAAAAAAAAAAAAAAAAAAAAA+P///wMAAAAAAADg/////wAAAAAAAIAP//8ZAAAAAAAAAAAAAAAAAAAAAAAA+P///z8AAAAAAADw////fwAAAAAAAAAP/vvYAwAAAAAAAAAAAAAAAAAAAAAA+P////8AAAAAAADw////PwAAAAAAAAAf/vnAZwAAAAAAAAAAAAAAAAAAAAAA+P////8fAAAAAADg////HwAAAAAAAAA//D2w9wMMAAAAAAAAAAAAAAAAAAAA+P////8/AAAAAACA////HwAAAAAAAAB8+Hl+/x84AAAAAAAAAAAAAAAAAAAA/P////9/AAAAAACA////DwAAAAAAAAA8QPkA+z84AAAAAAAAAAAAAAAAAAAA+P//////AQAAAACA////BwAAAAAAAAD4ANgA5D/PAAAAAAAAAAAAAAAAAAAA/P//////AwAAAAAA////DwAAAAAAAADgHwAAxP+HAQAAAAAAAAAAAAAAAAAA8P//////AwAAAAAA////DwAAAAAAAADAfwAAwP8ABwAAAAAAAAAAAAAAAAAA8P//////AQAAAAAA////DwAAAAAAAAAA/H4P4M8BGAAAAAAAAAAAAAAAAAAA4P//////AQAAAAAA////DwAAAAAAAAAAAJ8DAIYHOAAAAAAAAAAAAAAAAAAA4P//////AAAAAAAA/v//HwAAAAAAAAAAAJABAIQHYAAAAAAAAAAAAAAAAAAAwP////9/AAAAAAAA/v//HwAAAAAAAAAAAACAHw4AAAAAAAAAAAAAAAAAAAAAwP////9/AAAAAAAA/v//HzAAAAAAAAAAAADAHw4AAAAAAAAAAAAAAAAAAAAAgP////8/AAAAAAAA////H3gAAAAAAAAAAADsHw4AAAAAAAAAAAAAAAAAAAAAgP////8/AAAAAAAA////H3gAAAAAAAAAAAD+Dz4AAAwAAAAAAAAAAAAAAAAAAP////8/AAAAAACA////H34AAAAAAAAAAAD/Pz4AAAwAAQAAAAAAAAAAAAAAAPz///8fAAAAAACA////H38AAAAAAAAAAID/fz4AAAjAAAAAAAAAAAAAAAAAAPD///8fAAAAAACA////hz8AAAAAAAAAAMD//38AAABgAAAAAAAAAAAAAAAAAOD///8fAAAAAACA////AT8AAAAAAAAAAOD//38AAABgAAAAAAAAAAAAAAAAAOD///8fAAAAAAAA////AD8AAAAAAAAAAPj///8BAAAAAAAAAAAAAAAAAAAAAOD///8PAAAAAAAA/v9/gB8AAAAAAAAAAP////8BAAMAAAAAAAAAAAAAAAAAAOD///8PAAAAAAAA/v//gA8AAAAAAAAAwP////8DAAcAAAAAAAAAAAAAAAAAAOD///8HAAAAAAAA/P//gA8AAAAAAAAA4P////8HAAwAAAAAAAAAAAAAAAAAAOD///8AAAAAAAAA/P//gA8AAAAAAAAA4P////8HAAAAAAAAAAAAAAAAAAAAAOD//z8AAAAAAAAA/P//gA8AAAAAAAAA4P////8fAAAAAAAAAAAAAAAAAAAAAOD//w8AAAAAAAAA/P8/AAcAAAAAAAAA4P////8fAAAAAAAAAAAAAAAAAAAAAOD//w8AAAAAAAAA/P8fAAAAAAAAAAAA4P////8/AAAAAAAAAAAAAAAAAAAAAOD//w8AAAAAAAAA+P8fAAAAAAAAAAAAwP////8/AAAAAAAAAAAAAAAAAAAAAPD//w8AAAAAAAAA8P8fAAAAAAAAAAAAwP////8/AAAAAAAAAAAAAAAAAAAAAPD//wcAAAAAAAAA4P8PAAAAAAAAAAAAgP////8/AAAAAAAAAAAAAAAAAAAAAPD//wMAAAAAAAAA4P8HAAAAAAAAAAAAwP////8/AAAAAAAAAAAAAAAAAAAAAPD//wEAAAAAAAAAwP8HAAAAAAAAAAAAgP////8fAAAAAAAAAAAAAAAAAAAAAPD//wAAAAAAAAAA4P8BAAAAAAAAAAAAgP8P//8fAAAAAAAAAAAAAAAAAAAAAPD//wAAAAAAAAAAwP8AAAAAAAAAAAAAgP8B/P8PAAAAAAAAAAAAAAAAAAAAAPD/fwAAAAAAAAAAwAMAAAAAAAAAAAAAgE8A+P8PAAADAAAAAAAAAAAAAAAAAPj/BwAAAAAAAAAAAAAAAAAAAAAAAAAAAAcA8P8HAAAGAAAAAAAAAAAAAAAAAPj/DwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgP8HAAAOAAAAAAAAAAAAAAAAAPz/BwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgP8DAAB8AAAAAAAAAAAAAAAAAPz/BwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP8AAAB8AAAAAAAAAAAAAAAAAPw/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAA+AAAAAAAAAAAAAAAAAPw/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALABAAAbAAAAAAAAAAAAAAAAAP43AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPABAIAfAAAAAAAAAAAAAAAAAP4fAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOABAIADAAAAAAAAAAAAAAAAAP4HAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMAAAPADAAAAAAAAAAAAAAAAAP4HAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPAAAAAAAAAAAAAAAAAAAP4HAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHwAAAAAAAAAAAAAAAAAAP8BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwAAAAAAAAAAAAAAAAAAP8HAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP8HAAAAAAAAAAAAAAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP8BAAAAAAAAAAAAAAAAAAAAAAcAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/ABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP6AAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPwBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPgHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPAHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8AAAAAAAAAAAAAAAAAAAeAAAAAAAcIAAACAAAAAAAAAAAAAAAAAAAAAAAAAA/AAAAAAAAAAAAAAAAAMA/AAAAGAD//+P//z8AAAAAAAAAAAAAAAAAAAAAAAAPAAAAAAAAAAAAAAAAAP7/+wHw/////////38AAAAAAAAAAAAAAAAAAAAAACAfAAAAAAAAAAAAAABg8P///wP8////////////AAAAAAAAAAAAAAAAAAAAAPA/AAAAAAAAAAAI4gD8/////+P/////////////DwAAAAAAAAAAAAAAAAAAAPB/AAAAAAAAIID//////////+P//////////////x8AAAAAAAAAAAAA4AsAAP9/AAAAAAAA//////////////n///////////////8AAAAAAAAAAAAA8A8EAP5/AAAAAADg//////////////////////////////8AAAAAAAAA8D4E8P//////AAAAAAD4/////////////////////////////z8AAAAAAAD+////+P////9/AAAAAAD4/////////////////////////////w8AAAAAAP7///////////8PAAAAAMD//////////////////////////////wEAAABggP////////////8AAAAAgP///////////////////////////////wAAAADg/////////////wcAACAA/P///////////////////////////////wEAAADv/////////////wMAAPwB/////////////////////////////////wcAAAAe/////////////wDAAP8B/////////////////////////////////wAAAAAAAP///////////x/+4f8B/v//////////////////////////////HwAAAACA//////////////+fAP7+////////////////////////////////PwAAAAAA/P///////////////////////////////////////////////////wMAAAQA/P///////////////////////////////////////////////////z8A//8A4P//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////";

  const maskBin = atob(MASK_B64);
  const maskBits = new Uint8Array(maskBin.length);
  for (let i = 0; i < maskBin.length; i++) maskBits[i] = maskBin.charCodeAt(i);

  const isLand = (latDeg, lonDeg) => {
    const x = Math.min(MASK_W - 1, Math.max(0, Math.floor(lonDeg + 180)));
    const y = Math.min(MASK_H - 1, Math.max(0, Math.floor(90 - latDeg)));
    const idx = y * MASK_W + x;
    return (maskBits[idx >> 3] >> (idx & 7)) & 1;
  };

  /* ---------- Greetings ---------- */
  const GREETINGS = [
    { word: "Hola",      lang: "es", name: "Spanish",    city: "Mexico City", lat:  19.43, lon:  -99.13 },
    { word: "Olá",       lang: "pt", name: "Portuguese", city: "São Paulo",   lat: -23.55, lon:  -46.63 },
    { word: "Bonjour",   lang: "fr", name: "French",     city: "Dakar",       lat:  14.72, lon:  -17.47 },
    { word: "مرحبا",     lang: "ar", name: "Arabic",     city: "Cairo",       lat:  30.04, lon:   31.24, rtl: true },
    { word: "Jambo",     lang: "sw", name: "Swahili",    city: "Nairobi",     lat:  -1.29, lon:   36.82 },
    { word: "Merhaba",   lang: "tr", name: "Turkish",    city: "Istanbul",    lat:  41.01, lon:   28.98 },
    { word: "नमस्ते",     lang: "hi", name: "Hindi",      city: "Delhi",       lat:  28.61, lon:   77.21 },
    { word: "你好",       lang: "zh", name: "Mandarin",   city: "Beijing",     lat:  39.90, lon:  116.40 },
    { word: "こんにちは", lang: "ja", name: "Japanese",   city: "Tokyo",       lat:  35.68, lon:  139.69 },
    { word: "Kia ora",   lang: "mi", name: "Māori",      city: "Wellington",  lat: -41.29, lon:  174.78 },
    { word: "Hello",     lang: "en", name: "English",    city: "London",      lat:  51.51, lon:   -0.13 }
  ];

  const stage   = document.getElementById("stage");
  const copy    = document.getElementById("copy");
  const canvas  = document.getElementById("globe");
  const wordEl  = document.getElementById("word");
  const whereEl = document.getElementById("where");
  const nextBtn = document.getElementById("next");
  const ctx     = canvas.getContext("2d");

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const INTERVAL = 3800;
  const D2R = Math.PI / 180, TAU = Math.PI * 2;
  const CHALK = "244,243,255", SUN = "#ffcf3f", COBALT = "#2a35d9";

  /* ---------- Points spread evenly over a sphere ---------- */
  const N = 14000;
  const PX = new Float32Array(N), PY = new Float32Array(N), PZ = new Float32Array(N);
  const LAND = new Uint8Array(N);
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + 0.5) / N;
    const r = Math.sqrt(1 - y * y);
    const t = i * golden;
    const x = Math.cos(t) * r, z = Math.sin(t) * r;
    PX[i] = x; PY[i] = y; PZ[i] = z;
    LAND[i] = isLand(Math.asin(y) / D2R, Math.atan2(x, z) / D2R);
  }

  /* ---------- State ---------- */
  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 100;
  let index = 0;
  const targetFor = g => ({
    lon: g.lon,
    lat: Math.max(-60, Math.min(60, g.lat - 12))
  });
  let target = targetFor(GREETINGS[index]);
  const cur = reduced
    ? { lon: target.lon, lat: target.lat }
    : { lon: target.lon - 150, lat: 20 };
  let lastSwitch = performance.now() + 800;
  let lastFrame = 0;
  let swapTimer = null;

  /* ---------- Layout ---------- */
  function layout() {
    const rect = stage.getBoundingClientRect();
    W = rect.width; H = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    if (W / H >= 1.3 && W >= 720) {
      // Side by side: text on the left, globe on the right
      cx = W * 0.72;
      cy = H * 0.5;
      R = Math.min(H * 0.4, W * 0.27);
    } else {
      // Stacked: globe in the space above the text
      const top = 72; // clear the navigation
      const copyTop = copy.getBoundingClientRect().top - rect.top;
      const space = Math.max(copyTop - top - 16, 200);
      R = Math.min(W * 0.42, space * 0.47);
      cx = W / 2;
      cy = top + space / 2;
    }
    draw(performance.now());
  }

  /* ---------- Drawing ---------- */
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const a = -cur.lon * D2R, b = cur.lat * D2R;
    const cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b);

    const spacing = R * 0.0297;
    const rLand = Math.max(spacing * 0.22, 0.8);
    const rSea = rLand * 0.6;

    const sea = new Path2D();
    const land = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    const landAlpha = [0.3, 0.5, 0.78, 1];

    for (let i = 0; i < N; i++) {
      const x = PX[i], y = PY[i], z = PZ[i];
      const z1 = -x * sA + z * cA;
      const z2 = y * sB + z1 * cB;
      if (z2 <= 0.02) continue;
      const x1 = x * cA + z * sA;
      const y2 = y * cB - z1 * sB;
      const sx = cx + R * x1, sy = cy - R * y2;
      const k = 0.55 + 0.45 * z2;

      if (LAND[i]) {
        const level = z2 < 0.2 ? 0 : z2 < 0.45 ? 1 : z2 < 0.7 ? 2 : 3;
        const r = rLand * k;
        land[level].moveTo(sx + r, sy);
        land[level].arc(sx, sy, r, 0, TAU);
      } else {
        const r = rSea * k;
        sea.moveTo(sx + r, sy);
        sea.arc(sx, sy, r, 0, TAU);
      }
    }

    ctx.fillStyle = `rgba(${CHALK}, 0.2)`;
    ctx.fill(sea);
    for (let l = 0; l < 4; l++) {
      ctx.fillStyle = `rgba(${CHALK}, ${landAlpha[l]})`;
      ctx.fill(land[l]);
    }

    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.strokeStyle = `rgba(${CHALK}, 0.22)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    drawMarker(now, cA, sA, cB, sB);
  }

  function drawMarker(now, cA, sA, cB, sB) {
    const g = GREETINGS[index];
    const lat = g.lat * D2R, lon = g.lon * D2R;
    const x = Math.cos(lat) * Math.sin(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon);
    const z1 = -x * sA + z * cA;
    const z2 = y * sB + z1 * cB;
    if (z2 <= 0.05) return;
    const sx = cx + R * (x * cA + z * sA);
    const sy = cy - R * (y * cB - z1 * sB);

    if (!reduced) {
      const t = ((now / 1000) % 1.8) / 1.8;
      ctx.beginPath();
      ctx.arc(sx, sy, 7 + t * 30, 0, TAU);
      ctx.strokeStyle = SUN;
      ctx.globalAlpha = 0.75 * (1 - t);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.beginPath();
    ctx.arc(sx, sy, 5.5, 0, TAU);
    ctx.fillStyle = SUN;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = COBALT;
    ctx.stroke();
  }

  /* ---------- Greeting text ---------- */
  function applyText(g) {
    wordEl.textContent = g.word;
    wordEl.lang = g.lang;
    wordEl.dir = g.rtl ? "rtl" : "ltr";
    whereEl.textContent = g.name + ", " + g.city;
  }

  function showGreeting(g) {
    if (reduced) { applyText(g); return; }
    clearTimeout(swapTimer);
    wordEl.classList.add("out");
    whereEl.classList.add("out");
    swapTimer = setTimeout(() => {
      applyText(g);
      wordEl.classList.replace("out", "pre");
      whereEl.classList.replace("out", "pre");
      void wordEl.offsetWidth; // restart the transition from the "pre" position
      wordEl.classList.remove("pre");
      whereEl.classList.remove("pre");
    }, 190);
  }

  function advance() {
    index = (index + 1) % GREETINGS.length;
    const g = GREETINGS[index];
    target = targetFor(g);
    lastSwitch = performance.now();
    showGreeting(g);
    if (reduced) {
      cur.lon = target.lon; cur.lat = target.lat;
      draw(performance.now());
    }
  }

  nextBtn.addEventListener("click", advance);

  /* ---------- Animation loop ---------- */
  function frame(now) {
    const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.05) : 0.016;
    lastFrame = now;

    if (now - lastSwitch > INTERVAL) advance();

    const k = 1 - Math.exp(-dt * 2.4);
    const dLon = ((target.lon - cur.lon + 540) % 360) - 180;
    cur.lon += dLon * k;
    cur.lat += (target.lat - cur.lat) * k;

    draw(now);
    requestAnimationFrame(frame);
  }

  /* ---------- Go ---------- */
  new ResizeObserver(layout).observe(stage);
  new ResizeObserver(layout).observe(copy);
  layout();
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
